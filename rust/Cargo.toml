[package]
name = "uwueave"
version = "0.1.0"
edition = "2021"
publish = false
license = "Unlicense"
description = "The coordination-free fragment of a weave, implemented as proved: content-addressed causal DAG + op-log moves. Companion to the Uwueave theorems."
repository = "https://github.com/emberian/lean-uwueave"
categories = ["data-structures"]
keywords = ["crdt", "loom", "weave", "dag", "causal"]

[dependencies]
blake3 = "1"

[build-dependencies]
cc = "1"
serde_json = "1"

[dev-dependencies]
cc = "1"
proptest = "1"
serde_json = "1"
