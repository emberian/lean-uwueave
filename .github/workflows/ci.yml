name: CI

on:
  push:
    branches: [dev]
    tags: ['**']
  pull_request:
    branches: [dev]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  policy:
    name: policy
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # actions/checkout v4, resolved 2026-08-14.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install checksum-pinned elan and repository Lean toolchain
        env:
          ELAN_HOME: ${{ runner.temp }}/uwueave-elan
        run: scripts/install-pinned-elan.sh

      # dtolnay/rust-toolchain stable branch, resolved 2026-08-14. Debt-case
      # evidence is executable policy, so it uses the exact reviewed MSRV too.
      - name: Install Rust 1.89.0 for debt evidence
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.89.0

      - name: Verify exact Rust evidence toolchain
        run: scripts/v02-rust-msrv.sh

      - name: Hydrate locked debt-evidence dependencies
        run: cargo fetch --manifest-path rust/Cargo.toml --locked

      - name: Development metadata, debt, census, and mocked hbox gates
        if: github.ref_type != 'tag'
        run: scripts/v02-policy.sh

      - name: Release-tag metadata, debt, census, and mocked hbox gates
        if: github.ref_type == 'tag'
        env:
          UWUEAVE_RELEASE_TAG: ${{ github.ref_name }}
        run: scripts/v02-policy.sh --release-tag "$UWUEAVE_RELEASE_TAG"

  lean-acceptance:
    name: lean acceptance (cold Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      # actions/checkout v4, resolved 2026-08-14.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Install checksum-pinned elan and repository Lean toolchain
        env:
          ELAN_HOME: ${{ runner.temp }}/uwueave-elan
        run: scripts/install-pinned-elan.sh

      - name: Cold proof build and acceptance suite
        env:
          UWUEAVE_V02_COLD_BUILD: 1
        run: scripts/v02-lean-acceptance.sh

  native:
    name: native (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            linker_env: CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER
          - os: macos-15
            target: aarch64-apple-darwin
            linker_env: CARGO_TARGET_AARCH64_APPLE_DARWIN_LINKER
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      # actions/checkout v4, resolved 2026-08-14.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Install checksum-pinned elan and repository Lean toolchain
        env:
          ELAN_HOME: ${{ runner.temp }}/uwueave-elan
        run: scripts/install-pinned-elan.sh

      # dtolnay/rust-toolchain stable branch, resolved 2026-08-14. Rust 1.89.0
      # is the empirically verified crate MSRV and is selected exactly here.
      - name: Install Rust 1.89.0
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.89.0

      - name: Verify exact Cargo MSRV metadata and compiler
        run: scripts/v02-rust-msrv.sh

      - name: Hydrate locked Cargo dependencies
        run: cargo fetch --manifest-path rust/Cargo.toml --locked

      - name: Select exact native target, linker, and observation path
        shell: bash
        env:
          UWUEAVE_NATIVE_TARGET: ${{ matrix.target }}
          UWUEAVE_LINKER_ENV: ${{ matrix.linker_env }}
        run: |
          set -euo pipefail
          actual=$(rustc -vV | sed -n 's/^host: //p')
          test "$actual" = "$UWUEAVE_NATIVE_TARGET"
          compiler=$(command -v cc)
          archiver=$(command -v ar)
          test -n "$compiler" && test -n "$archiver"
          printf 'CC=%s\nAR=%s\n' "$compiler" "$archiver" >> "$GITHUB_ENV"
          printf '%s=%s\n' "$UWUEAVE_LINKER_ENV" "$compiler" >> "$GITHUB_ENV"
          printf 'UWUEAVE_LEDGER2_OBSERVATION_PATH=%s/ledger2-native-%s.json\n' \
            "$RUNNER_TEMP" "$UWUEAVE_NATIVE_TARGET" >> "$GITHUB_ENV"

      - name: Frozen all-target native suite
        run: cargo test --manifest-path rust/Cargo.toml --frozen --all-targets

      - name: Validate and retain native Ledger-2 observation
        env:
          UWUEAVE_NATIVE_TARGET: ${{ matrix.target }}
        run: |
          UWUEAVE_LEDGER2_OBSERVATION_OUT="$UWUEAVE_LEDGER2_OBSERVATION_PATH" \
            cargo test --manifest-path rust/Cargo.toml --frozen \
              --test runtime_build_closure
          python3 scripts/ledger2-gate.py observation \
            --expect-target "$UWUEAVE_NATIVE_TARGET" \
            "$UWUEAVE_LEDGER2_OBSERVATION_PATH"
          python3 -m json.tool "$UWUEAVE_LEDGER2_OBSERVATION_PATH"
